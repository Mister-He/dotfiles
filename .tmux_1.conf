##### General ###############################################################

set -g default-terminal "tmux-256color"

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g mouse on

set -g default-shell /bin/zsh
set -g default-command "exec /bin/zsh"


##### Prefix ################################################################

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


##### Copy mode #############################################################

setw -g mode-keys vi

bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel


##### Pane resizing #########################################################

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


##### Pane appearance #######################################################

set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#f9e2af'


##### Catppuccin ############################################################

set -g @catppuccin_flavor "mocha"

# set -g @catppuccin_application_icon " "
# set -g @catppuccin_application_color "#{@thm_pink}"
# set -g @catppuccin_application_text "#{pane_current_command}"

# Catppuccin installed by TPM
run "~/.tmux/plugins/tmux/catppuccin.tmux"


##### Status line ###########################################################

set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_application}"


##### TPM plugins ###########################################################

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "catppuccin/tmux#v2.3.0"

set -g @plugin "sainnhe/tmux-fzf"
set -g @plugin "tmux-plugins/tmux-sidebar"
set -g @plugin "tmux-plugins/tmux-resurrect"

# 如果暂时不需要，建议先不要启用 tmux-powerline
set -g @plugin "erikw/tmux-powerline"


##### Reload config #########################################################

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"


##### TPM initialization ####################################################

run "~/.tmux/plugins/tpm/tpm"
