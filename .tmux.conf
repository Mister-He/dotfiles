# Make the status line more pleasant.
set -g status-left ""

# Always renumber the window when delete 
set -g renumber-windows on

# Ensure that everything on the right side of the status line
# is included.
set -g @catppuccin_flavor 'mocha'

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-right-length 100

# In ~/.tmux.conf, after the catppuccin plugin has been loaded.

%hidden MODULE_NAME="battery_module"

set -g "@catppuccin_${MODULE_NAME}_icon" " "
set -gF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_pink}"
set -g "@catppuccin_${MODULE_NAME}_text" "#{pane_current_command}"

# 先清空
# set -g status-right ""

# # 追加 catppuccin 自带的 application 模块
# set -ga status-right '#{E:@catppuccin_status_application}'

# # 追加自定义模块
# set -ga status-right '#{E:@catppuccin_status_my_custom_module}'
#
# # 追加分隔符和图标
# set -ga status-right "#[bg=#{@thm_flamingo},fg=#{@thm_crust}]#[reverse]#[noreverse]󱀙 "  

# # 追加内存占用
# set -ga status-right '#[fg=#{@thm_fg},bg=#{@thm_mantle}] #(memory_pressure | awk "/percentage/{print \$5}")'

# # 最后加载模块工具
# source ~/.config/tmux/plugins/catppuccin/tmux/utils/status_module.conf

set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#f9e2af'

# non-plugin options
set -g default-terminal 'tmux-256color'
set -g base-index 1
set -g pane-base-index 1
set -g mouse on

# Define interactive login shell
# Force tmux to read from .zshrc instead of .zprofile
# This is for failing activating conda environment inside tmux
set -g default-shell /bin/zsh
set -g default-command "exec /bin/zsh"

# keymaps
unbind C-b
set -g prefix C-space
bind C-Space send-prefix

# Visual mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel 

# Adjust pane size
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# This part is from tpm
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'
# tmux power-line
set -g @plugin 'erikw/tmux-powerline'

# tmux fzf
set -g @plugin 'sainnhe/tmux-fzf'

# tmux sidebar
set -g @plugin 'tmux-plugins/tmux-sidebar'

# tmux resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
